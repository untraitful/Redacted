<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redactor</title>
  <link rel="stylesheet" href="page.css">
</head>
<body class="popup">
<main>
  <header class="hdr">
    <div>Redactor<br><span class="k">Version <span id="version">—</span></span></div>
    <div class="r"><span id="host-line">this tab</span><br><span class="k">local only</span></div>
  </header>
  <div class="block"><label class="check"><input type="checkbox" id="enabled"> Redactor is on</label></div>
  <div class="block" id="site"></div>
  <dl class="leaders block">
    <div><dt>Redactions in this tab</dt><span class="dots" aria-hidden="true"></span><dd id="count">0</dd></div>
    <div><dt>Values in the vault</dt><span class="dots" aria-hidden="true"></span><dd id="vault-size">0</dd></div>
  </dl>
  <h2>References</h2>
  <p class="muted" id="vault-empty">Nothing redacted in this tab yet.</p>
  <ul class="list" id="vault"></ul>
  <div class="row"><button id="clear">Clear vault</button><button id="options">Settings</button></div>
</main>
<script src="popup.js"></script>
</body>
</html>
